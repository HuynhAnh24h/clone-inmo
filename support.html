<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INMO Support</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
  :root {
    --sp-bg: #0a0b0c;
    --sp-card: #131416;
    --sp-line: rgba(255,255,255,0.09);
    --sp-text-dim: #9a9ea3;
  }

  body {
    background: var(--sp-bg);
    color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ================= TOP BAR ================= */
  .sp-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 20px 40px;
    border-bottom: 1px solid var(--sp-line);
    flex-wrap: wrap;
  }

  .sp-search {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--sp-card);
    border: 1px solid var(--sp-line);
    border-radius: 8px;
    padding: 9px 14px;
    width: 340px;
    max-width: 100%;
    color: var(--sp-text-dim);
  }
  .sp-search input {
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    flex: 1;
    font-size: 0.9rem;
  }
  .sp-search input::placeholder { color: var(--sp-text-dim); }
  .sp-search kbd {
    background: #1e2022;
    border: 1px solid var(--sp-line);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 0.7rem;
    color: var(--sp-text-dim);
  }

  .sp-topbar__right {
    display: flex;
    align-items: center;
    gap: 22px;
    flex-wrap: wrap;
  }

  .sp-socials {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .sp-socials a {
    color: #d4d4d4;
    font-size: 1rem;
  }
  .sp-socials a:hover { color: #fff; }

  .sp-select {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #d4d4d4;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .sp-select i:first-child { font-size: 0.95rem; }
  .sp-select .bi-chevron-down { font-size: 0.7rem; color: var(--sp-text-dim); }

  /* ================= TITLE ================= */
  .sp-title {
    font-size: 2.2rem;
    font-weight: 800;
    padding: 40px;
    margin: 0;
  }

  .sp-title-divider {
    border-bottom: 1px solid var(--sp-line);
  }

  /* ================= QUICK LINK CARDS ================= */
  .sp-links {
    padding: 40px;
  }

  .sp-link-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--sp-card);
    border: 1px solid var(--sp-line);
    border-radius: 10px;
    padding: 22px 26px;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.05rem;
    margin-bottom: 20px;
  }
  .sp-link-card i {
    color: var(--sp-text-dim);
    transition: transform 0.2s ease;
  }
  .sp-link-card:hover {
    border-color: rgba(255,255,255,0.25);
    color: #fff;
  }
  .sp-link-card:hover i { transform: translateX(4px); color: #fff; }

  /* ================= PRODUCT SUPPORT ================= */
  .sp-section-heading {
    text-align: center;
    font-size: 2rem;
    font-weight: 800;
    margin-bottom: 56px;
  }

  .sp-product {
    display: block;
    text-align: center;
    text-decoration: none;
    color: #fff;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--sp-line);
  }
  .sp-product__media {
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }
  .sp-product__media img {
    max-height: 100%;
    max-width: 100%;
    object-fit: contain;
  }
  .sp-product__name {
    font-weight: 700;
    font-size: 1.15rem;
  }

  /* ================= STILL NEED HELP ================= */
  .sp-help {
    text-align: center;
    padding: 90px 40px 100px;
  }
  .sp-help__title {
    font-size: 2.4rem;
    font-weight: 800;
    margin-bottom: 14px;
  }
  .sp-help__desc {
    color: var(--sp-text-dim);
    margin-bottom: 50px;
  }

  .sp-help__options {
    display: flex;
    justify-content: center;
    gap: 60px;
    flex-wrap: wrap;
  }

  .sp-help__option {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: #fff;
    font-size: 0.95rem;
  }

  .sp-help__icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #111;
    font-size: 1.4rem;
  }

  @media (max-width: 767px) {
    .sp-topbar { padding: 16px 20px; }
    .sp-title, .sp-links { padding-left: 20px; padding-right: 20px; }
    .sp-title { font-size: 1.7rem; }
  }
</style>
</head>
<body>

<!-- ================= TOP BAR ================= -->
<div class="sp-topbar">
  <div class="sp-search">
    <i class="bi bi-search"></i>
    <input type="text" placeholder="Search">
    <kbd>Ctrl K</kbd>
  </div>

  <div class="sp-topbar__right">
    <div class="sp-socials">
      <a href="#" aria-label="Email"><i class="bi bi-envelope"></i></a>
      <a href="#" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
      <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
      <a href="#" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
      <a href="#" aria-label="Discord"><i class="bi bi-discord"></i></a>
      <a href="#" aria-label="Reddit"><i class="bi bi-reddit"></i></a>
      <a href="#" aria-label="X"><i class="bi bi-twitter-x"></i></a>
    </div>

    <div class="sp-select">
      <i class="bi bi-circle-half"></i>
      <span>Auto</span>
      <i class="bi bi-chevron-down"></i>
    </div>

    <div class="sp-select">
      <i class="bi bi-translate"></i>
      <span>English</span>
      <i class="bi bi-chevron-down"></i>
    </div>
  </div>
</div>

<!-- ================= TITLE ================= -->
<div class="sp-title-divider">
  <h1 class="sp-title">INMO Support</h1>
</div>

<!-- ================= QUICK LINKS ================= -->
<div class="sp-links">
  <div class="row g-3" id="quickLinksWrap"></div>
</div>

<!-- ================= PRODUCT SUPPORT ================= -->
<div class="container py-4">
  <h2 class="sp-section-heading">Product Support</h2>
  <div class="row row-cols-1 row-cols-md-2 g-5" id="productsWrap"></div>
</div>

<!-- ================= STILL NEED HELP ================= -->
<div class="sp-help">
  <h2 class="sp-help__title">Still Need Help?</h2>
  <p class="sp-help__desc">We're happy to assist you whenever you need us.</p>

  <div class="sp-help__options">
    <a href="#" class="sp-help__option">
      <span class="sp-help__icon"><i class="bi bi-headset"></i></span>
      Email us
    </a>
    <a href="#" class="sp-help__option">
      <span class="sp-help__icon"><i class="bi bi-chat-dots"></i></span>
      Live Chat
    </a>
  </div>
</div>

<script>
  // ---- quick link cards ----
  const quickLinksData = [
    { label: 'Back to INMOXR', href: '#' },
    { label: 'APP & Manuals Downloads', href: '#' },
    { label: 'Development', href: '#' },
    { label: 'Warranty', href: '#' }
  ];
  const quickLinksWrap = document.getElementById('quickLinksWrap');
  quickLinksData.forEach((l) => {
    const col = document.createElement('div');
    col.className = 'col-md-6';
    col.innerHTML = `
      <a href="${l.href}" class="sp-link-card">
        <span>${l.label}</span>
        <i class="bi bi-arrow-right"></i>
      </a>
    `;
    quickLinksWrap.appendChild(col);
  });

  // ---- product support cards ----
  const productsData = [
    { name: 'INMO Air3', img: 'https://placehold.co/360x220/0a0b0c/ffffff?text=INMO+Air3', href: '#' },
    { name: 'INMO GO', img: 'https://placehold.co/360x220/0a0b0c/ffffff?text=INMO+GO', href: '#' },
    { name: 'INMO GO2', img: 'https://placehold.co/360x220/0a0b0c/ffffff?text=INMO+GO2', href: '#' },
    { name: 'INMO Air2', img: 'https://placehold.co/360x220/0a0b0c/ffffff?text=INMO+Air2', href: '#' }
  ];
  const productsWrap = document.getElementById('productsWrap');
  productsData.forEach((p) => {
    const col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = `
      <a href="${p.href}" class="sp-product">
        <div class="sp-product__media"><img src="${p.img}" alt="${p.name}"></div>
        <div class="sp-product__name">${p.name}</div>
      </a>
    `;
    productsWrap.appendChild(col);
  });
</script>

</body>
</html>
